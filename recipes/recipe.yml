---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: ultimos
description: Testando uma build customizada do bazzite com WMs.
base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - terra-release
        - nwg-look

  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland
        - paolino/hyprmoncfg
        - faugus/faugus-launcher
        
    install:
      packages:
        - adw-gtk3-theme
        - hyprland
        - noctalia
        - hyprland-guiutils
        - mpv
        - hyprmoncfg
        - faugus-launcher
        - alacritty
        - neovim
        - niri
        - xwayland-satellite
        - android-tools
        
    remove:
      packages:
        - waydroid
        - waydroid-selinux
        - rom-properties

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    install:
      packages:
        - brave-origin

  - type: signing
